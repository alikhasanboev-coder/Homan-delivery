<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homan — Доставка</title>
<script>try{var t=localStorage.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
@font-face{font-family:Actay;src:url(fonts/Actay-Regular.otf);font-weight:400}
@font-face{font-family:Actay;src:url(fonts/ActayWide-Bold.otf);font-weight:700}
:root{--acc:#2563EB;--on:#fff;--r:#EE3A44;--ok:#1f9d55;--ink:#0b0b0c;--mut:#6b6b70;--line:#e4e4e7;--bg:#fff;--soft:#f4f4f5;--card:#fff}
html[data-theme=dark]{--ink:#f4f4f5;--mut:#9a9aa0;--line:#26262a;--bg:#0a0a0a;--soft:#17171a;--card:#101012}
body[data-role=courier]{--acc:#FAB31C;--on:#161616}
*{box-sizing:border-box;margin:0}
body{font:400 15px/1.45 Actay,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
h1,h2,.b{font-weight:700}
header{background:#0a0a0a;border-bottom:1px solid #222;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:14px}.brand img{height:30px}
.brand span{font:400 18px Actay,system-ui,sans-serif;color:#c9c9cc;letter-spacing:.06em;padding-left:14px;border-left:1px solid #444;line-height:1.1}
.hb{display:flex;gap:8px}
header button{background:none;border:1px solid #3a3a3e;color:#cfcfd2;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center}
header svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#th .sun{display:none}html[data-theme=dark] #th .sun{display:block}html[data-theme=dark] #th .moon{display:none}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
#pick{min-height:calc(100vh - 150px);padding-bottom:14vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#pick h1{font-size:24px;margin-bottom:20px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:17px;width:100%;max-width:624px}
.pick button{padding:55px 16px;border:0;border-radius:19px;font:700 24px Actay,system-ui;cursor:pointer;transition:transform .15s}
.pick button:hover{transform:translateY(-2px)}.pick button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pick small{display:block;font:400 16px Actay,system-ui;margin-top:7px;opacity:.8}
.shop{background:#2563EB;color:#fff}.cour{background:#FAB31C;color:#161616}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 72px 40px;gap:8px}
.src{display:flex;gap:8px;margin-top:8px}
.src label{display:block;margin:0;position:relative}
.src input{position:absolute;opacity:0;width:auto;padding:0;border:0}
.src span{display:block;padding:7px 16px;border:1px solid var(--line);border-radius:99px;cursor:pointer;font-size:14px;color:var(--mut)}
.src input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--on)}
.src input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.btn{font:700 15px Actay,system-ui;border:0;border-radius:10px;padding:13px 18px;cursor:pointer;background:var(--acc);color:var(--on)}
.btn.red{background:var(--r);color:#fff}.btn.ghost{background:none;border:1px dashed var(--line);color:var(--mut);font-weight:400}
.btn.full{width:100%;margin-top:16px}.btn:disabled{opacity:.5}
.x{background:none;border:1px solid var(--line);border-radius:10px;color:var(--mut);cursor:pointer;font-size:18px}
.tabs{display:flex;gap:6px;margin:4px 0 16px}
.tabs button{flex:1;font:700 14px Actay,system-ui;padding:11px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:10px;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--acc);box-shadow:inset 0 -3px 0 var(--acc)}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.new{color:var(--r);border-color:var(--r)}.going{color:#b57b00;border-color:#FAB31C}.done{color:var(--ok);border-color:var(--ok)}
.mut{color:var(--mut);font-size:13px}ul{list-style:none;padding:10px 0 0}li{padding:3px 0}
.tag{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px}
a{color:inherit}.tglink{font-size:12px;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:40px 0}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}.btn.line.dng{color:var(--r);border-color:var(--r)}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1;padding:10px;font-size:14px}
.cancelled{color:var(--mut);border-color:var(--line)}.dim{opacity:.6}
:root{--w1:rgba(37,99,235,.28);--w2:rgba(37,99,235,.18);--w3:rgba(37,99,235,.10)}
html[data-theme=dark]{--w1:rgba(59,130,246,.30);--w2:rgba(59,130,246,.20);--w3:rgba(59,130,246,.12)}
header,main{position:relative;z-index:1}
.sea{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
body[data-role] .sea{display:none}
.wave{position:absolute;left:0;bottom:0;width:200%;will-change:transform}
.wave path{fill:var(--w3)}
.w3{height:30vh;animation:flow 30s linear infinite reverse}
.w2{height:24vh;animation:flow 20s linear infinite}.w2 path{fill:var(--w2)}
.w1{height:18vh;animation:flow 13s linear infinite reverse}.w1 path{fill:var(--w1)}
.chip{background:#0a0a0a;border-radius:14px;padding:11px 15px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:bob var(--b) ease-in-out infinite}.chip img{display:block;width:100%}
@keyframes flow{to{transform:translateX(-50%)}}
.fl{position:absolute;left:-140px;width:var(--s);will-change:transform;animation:drift var(--d) linear infinite;animation-delay:var(--l)}
.ic{display:block;width:100%;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;color:var(--ink);opacity:.5;animation:bob var(--b) ease-in-out infinite}
@keyframes drift{to{transform:translateX(calc(100vw + 280px))}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}
@media(max-width:600px){.fl.x{display:none}}
@media(prefers-reduced-motion:reduce){.sea *{animation:none!important}.fl{left:var(--x,12%)}}
@font-face{font-family:BebasNote;src:url(fonts/BebasNoteBold.ttf)}
.dv{display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid #444;color:#FAB31C}
.dv svg{width:34px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.dv .tr{animation:rumble 1.2s ease-in-out infinite}
.dv .sp{stroke-dasharray:3 3;animation:dash .7s linear infinite}
.dv b{font:400 21px/1 BebasNote,Actay,sans-serif;letter-spacing:.08em;color:#fff;padding-top:2px}
.dv b::first-letter{font-size:1.3em}
@keyframes rumble{50%{transform:translateY(-1.5px)}}
@keyframes dash{to{stroke-dashoffset:-6}}
@media(max-width:480px){.brand{gap:10px}.dv{padding-left:10px;gap:5px}.dv svg{width:30px}.dv b{font-size:18px;letter-spacing:.06em}}
@media(prefers-reduced-motion:reduce){.dv *{animation:none!important}}
.hide{display:none!important}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#161616;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid #333}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-fr" viewBox="0 0 64 64"><rect x="18" y="6" width="28" height="52" rx="4"/><path d="M18 26h28M24 14v6M24 32v10"/></symbol>
<symbol id="i-wm" viewBox="0 0 64 64"><rect x="10" y="8" width="44" height="48" rx="5"/><circle cx="32" cy="34" r="12"/><circle cx="32" cy="34" r="5"/><path d="M18 16h2M26 16h20"/></symbol>
<symbol id="i-tv" viewBox="0 0 64 64"><rect x="8" y="14" width="48" height="32" rx="4"/><path d="M24 54h16M32 46v8"/></symbol>
<symbol id="i-mw" viewBox="0 0 64 64"><rect x="6" y="16" width="52" height="32" rx="4"/><rect x="12" y="22" width="28" height="20" rx="2"/><path d="M48 24v2M48 33v2M48 41v1"/></symbol>
<symbol id="i-ac" viewBox="0 0 64 64"><rect x="6" y="14" width="52" height="20" rx="4"/><path d="M12 28h40M18 42q4 6 0 12M32 42q4 6 0 12M46 42q4 6 0 12"/></symbol>
<symbol id="i-kt" viewBox="0 0 64 64"><path d="M20 24h24l4 28a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4zM24 24v-4h16v4M48 30c10 0 10 14 0 14"/></symbol>
</defs></svg>
<div class="sea" aria-hidden="true">
<svg class="wave w3" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0 60C120 20 240 20 360 60S600 100 720 60S960 20 1080 60S1320 100 1440 60V200H0Z"/></svg>
<div class="fl " style="--x:6%;--s:70px;--d:95s;--l:-10s;--b:5.5s;bottom:15vh"><svg class="ic"><use href="#i-fr"/></svg></div><div class="fl x" style="--x:22%;--s:78px;--d:80s;--l:-48s;--b:6.5s;bottom:15vh"><svg class="ic"><use href="#i-wm"/></svg></div><div class="fl " style="--x:55%;--s:90px;--d:110s;--l:-70s;--b:5s;bottom:16vh"><svg class="ic"><use href="#i-tv"/></svg></div><div class="fl x" style="--x:38%;--s:76px;--d:88s;--l:-30s;--b:6s;bottom:14vh"><svg class="ic"><use href="#i-mw"/></svg></div><div class="fl " style="--x:72%;--s:92px;--d:100s;--l:-85s;--b:7s;bottom:15vh"><svg class="ic"><use href="#i-ac"/></svg></div><div class="fl " style="--x:86%;--s:60px;--d:75s;--l:-60s;--b:4.5s;bottom:16vh"><svg class="ic"><use href="#i-kt"/></svg></div>
<div class="fl" style="--x:46%;--s:170px;--d:105s;--l:-38s;--b:5.5s;bottom:17vh"><div class="chip"><img alt="" src="logo.png"></div></div>
<svg class="wave w2" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0 60C120 20 240 20 360 60S600 100 720 60S960 20 1080 60S1320 100 1440 60V200H0Z"/></svg>
<svg class="wave w1" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0 60C120 20 240 20 360 60S600 100 720 60S960 20 1080 60S1320 100 1440 60V200H0Z"/></svg>
</div>
<header>
  <div class="brand"><img src="logo.png" alt="Homan"><div class="dv"><svg viewBox="0 0 40 24" aria-hidden="true"><path class="sp" d="M1 8h5M0 12h6M2 16h4"/><g class="tr"><rect x="9" y="4" width="16" height="12" rx="2"/><path d="M25 8h5l4 4v4h-9z"/><circle cx="14" cy="18" r="2.5" fill="#0a0a0a"/><circle cx="30" cy="18" r="2.5" fill="#0a0a0a"/></g></svg><b>Delivery</b></div></div>
  <div class="hb">
    <button id="th" aria-label="Сменить тему"><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
    <button id="out" class="hide">Выйти</button>
  </div>
</header>
<main>
  <section id="pick">
    <h1>Выберите раздел</h1>
    <div class="pick">
      <button class="shop" data-r="shop">Магазин<small>Создание заказов</small></button>
      <button class="cour" data-r="courier">Курьер<small>Доставка заказов</small></button>
    </div>
  </section>

  <section id="app" class="hide">
    <div id="newform" class="card hide">
      <h2 id="ft" style="font-size:18px">Новый заказ</h2>
      <label for="n">Имя клиента</label><input id="n" autocomplete="off">
      <label for="p">Телефон</label><input id="p" type="tel" inputmode="tel" value="+998 " autocomplete="off">
      <label for="a">Адрес</label><input id="a" autocomplete="off">
      <label>Техника</label><div id="items"></div>
      <button class="btn ghost full" id="add" style="margin-top:0">+ Добавить товар</button>
      <label for="c">Комментарий</label><textarea id="c" rows="2"></textarea>
      <button class="btn full" id="send">Отправить заказ</button>
      <button class="btn line full hide" id="canc" style="margin-top:10px">Отменить редактирование</button>
    </div>
    <div class="tabs"><button data-t="active" class="on">Активные</button><button data-t="history">История</button></div>
    <div id="list"></div>
  </section>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s), ST={new:'Новый',going:'В пути',done:'Доставлен',cancelled:'Отменён'};
let role=null,tab='active',data={orders:[],bot:''},timer,rid=0,editId=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)};
const show=id=>['pick','app'].forEach(x=>$('#'+x).classList.toggle('hide',x!==id));
async function api(m,body){
  const r=await fetch('/api/orders',{method:m,headers:{'content-type':'application/json','x-role':role},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Ошибка');return j}
function fmt(v){let d=v.replace(/\D/g,'');if(d.startsWith('998'))d=d.slice(3);d=d.slice(0,9);
  let s='+998 ';if(d.length)s+=d.slice(0,2);if(d.length>2)s+=' '+d.slice(2,5);if(d.length>5)s+=' '+d.slice(5,7);if(d.length>7)s+=' '+d.slice(7,9);return s}
function row(it){const n='s'+(++rid),d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="row"><input class="nm" placeholder="Например: холодильник" aria-label="Товар"><input class="q" type="number" min="1" value="1" aria-label="Количество"><button class="x" aria-label="Удалить">×</button></div>'+
  '<div class="src"><label><input type="radio" name="'+n+'" value="Склад" checked><span>Склад</span></label><label><input type="radio" name="'+n+'" value="Магазин"><span>Магазин</span></label></div>';
  d.querySelector('.x').onclick=()=>{if($('#items').children.length>1)d.remove()};if(it){d.querySelector('.nm').value=it.name;d.querySelector('.q').value=it.qty;d.querySelector('input[value="'+(it.from==='Магазин'?'Магазин':'Склад')+'"]').checked=true}$('#items').append(d)}
function render(){
  const act=data.orders.filter(o=>o.status==='new'||o.status==='going'),his=data.orders.filter(o=>o.status==='done'||o.status==='cancelled');
  const L=tab==='active'?act.slice().reverse():his;
  if(!L.length){$('#list').innerHTML='<p class="empty">'+(tab==='active'?'Активных заказов нет':'История пуста')+'</p>';return}
  $('#list').innerHTML=L.map(o=>{
    const t=new Date(o.created).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    let act='';
    if(role==='courier'&&o.status==='new')act=`<button class="btn full" data-id="${o.id}" data-s="going">Выехал</button>`;
    if(role==='courier'&&o.status==='going')act=`<button class="btn red full" data-id="${o.id}" data-s="done">Доставлен</button>`;
    const edit=role==='shop'&&(o.status==='new'||o.status==='going')?`<div class="acts"><button class="btn line" data-edit="${o.id}">Изменить</button><button class="btn line dng" data-cancel="${o.id}">Отменить заказ</button></div>`:'';
    const link=role==='shop'&&o.status!=='done'&&!o.linked&&data.bot?`<p class="tglink" style="margin-top:8px">Клиент не подключил Telegram: t.me/${esc(data.bot)}</p>`:'';
    return `<div class="card${o.status==='cancelled'?' dim':''}"><div class="top"><div><div class="b">${esc(o.name)}</div>
    <div class="mut"><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · ${t}</div></div><span class="chip ${o.status}">${ST[o.status]}</span></div>
    <p style="margin-top:10px">${esc(o.address)}</p>
    <ul>${o.items.map(i=>`<li>${esc(i.name)} × ${i.qty}<span class="tag">${esc(i.from||'Склад')}</span></li>`).join('')}</ul>
    ${o.comment?`<p class="mut" style="margin-top:8px">${esc(o.comment)}</p>`:''}${link}${act}${edit}</div>`}).join('')}
async function load(){try{data=await api('GET');render()}catch(e){}}
function start(){document.body.dataset.role=role;show('app');$('#out').classList.remove('hide');$('#newform').classList.toggle('hide',role!=='shop');
  if(!$('#items').children.length)row();load();clearInterval(timer);timer=setInterval(load,8000)}
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{role=b.dataset.r;sessionStorage.role=role;start()});
$('#out').onclick=()=>{sessionStorage.clear();role=null;delete document.body.dataset.role;clearInterval(timer);$('#out').classList.add('hide');show('pick')};
$('#th').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.theme=n}catch(e){}};
$('#p').oninput=e=>{e.target.value=fmt(e.target.value)};
$('#p').onfocus=e=>{if(!e.target.value)e.target.value='+998 '};
$('#add').onclick=row;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));render()});
function resetForm(){editId=null;['n','a','c'].forEach(i=>$('#'+i).value='');$('#p').value='+998 ';$('#items').innerHTML='';row();$('#ft').textContent='Новый заказ';$('#send').textContent='Отправить заказ';$('#canc').classList.add('hide')}
function edit(o){editId=o.id;$('#n').value=o.name;$('#p').value=fmt(o.phone);$('#a').value=o.address;$('#c').value=o.comment||'';$('#items').innerHTML='';o.items.forEach(i=>row(i));$('#ft').textContent='Изменить заказ';$('#send').textContent='Сохранить изменения';$('#canc').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'})}
$('#canc').onclick=resetForm;
$('#send').onclick=async()=>{
  if($('#p').value.replace(/\D/g,'').length!==12){toast('Введите номер полностью');return}
  const items=[...document.querySelectorAll('#items .item')].map(r=>({name:r.querySelector('.nm').value,qty:r.querySelector('.q').value,from:r.querySelector('input[type=radio]:checked').value}));
  const b={name:$('#n').value,phone:$('#p').value,address:$('#a').value,items,comment:$('#c').value};
  $('#send').disabled=true;
  try{if(editId){await api('PUT',{...b,id:editId});toast('Изменения сохранены')}else{await api('POST',b);toast('Заказ отправлен')}
    resetForm();load()}
  catch(e){toast(e.message)}$('#send').disabled=false};
$('#list').onclick=async e=>{
  const f=e.target.closest('[data-id]'),ed=e.target.closest('[data-edit]'),ca=e.target.closest('[data-cancel]');
  if(ed){const o=data.orders.find(x=>x.id===ed.dataset.edit);if(o)edit(o);return}
  if(ca){if(!confirm('Отменить этот заказ?'))return;
    try{await api('PATCH',{id:ca.dataset.cancel,status:'cancelled'});if(editId===ca.dataset.cancel)resetForm();toast('Заказ отменён');load()}catch(x){toast(x.message)}return}
  if(!f)return;f.disabled=true;
  try{await api('PATCH',{id:f.dataset.id,status:f.dataset.s});load()}catch(x){toast(x.message);f.disabled=false;load()}};
if(sessionStorage.role){role=sessionStorage.role;start()}
</script>
</body>
</html>
